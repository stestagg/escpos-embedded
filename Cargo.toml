[package]
name = "escpos-embedded"
version = "0.1.0"
edition = "2021"
authors = ["Embedded Team <team@example.com>"]
description = "A no_std ESC/POS printer driver for embedded systems"
license = "MIT"

[dependencies]
embedded-io = { version = "0.6", optional = true }

[features]
# Vendor-specific commands for the EM5820 (and compatible) printer modules.
# Printers that only speak standard ESC/POS print these as text.
default = ["em5820"]
em5820 = []
# Experimental configuration commands for HS printer modules, recovered from
# the vendor settings tool.
hs-experimental = []
embedded_io = ["embedded-io"]
image = []
